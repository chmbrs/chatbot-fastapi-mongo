[project]
name = "chatbot-fastapi-mongo"
version = "0.1.0"
description = "A chatbot: FastAPI + MongoDB + an OpenAI-compatible LLM (OpenRouter free tier by default)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pymongo>=4.15",
    "openai>=1.54",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own documented DI pattern — Depends() in a default argument is
# evaluated per-request by FastAPI's routing, not once at def time.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# This is an application, not a packaged library — no build backend, so pytest
# needs to be told the rootdir is importable rather than relying on installation.
pythonpath = ["."]
