services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      - "8000:8000"
    # No env_file needed: Compose already reads ./.env for the ${VAR:-default}
    # interpolation below, so a missing .env just falls through to the defaults.
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB: ${MONGO_DB:-chatbot}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-google/gemma-4-26b-a4b-it:free}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:latest}
      PEER_HOP_LIMIT: ${PEER_HOP_LIMIT:-3}
    # Ollama runs on the host, not in this network. Docker Desktop resolves
    # host.docker.internal already; Linux needs it mapped explicitly, and the
    # mapping is harmless where it's redundant.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      target: ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      # api, not localhost: this is a server-to-server call over the compose
      # network, from Streamlit's Python backend, never from the browser,
      # so it needs no CORS entry on the api service either.
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy

  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: chatbot_test
      LLM_PROVIDER: demo
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
